<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Etteln Live Twin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#f6f5f1;--fg:#1d2428;--mut:#5d6a70;--card:#fff;--line:#dcd9d0;--acc:#0b6e69}
@media (prefers-color-scheme:dark){:root{--bg:#14191b;--fg:#e8ecec;--mut:#9aa8ad;--card:#1d2427;--line:#2f3a3e;--acc:#4fc3bb}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,Segoe UI,sans-serif;display:grid;grid-template-columns:340px 1fr;grid-template-rows:auto 1fr}
header{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:1px solid var(--line)}
header a{color:var(--acc);text-decoration:none;font-weight:600}
header h1{font-size:1.05rem;margin:0}
#status{margin-left:auto;font-size:.85rem;color:var(--mut)}
#status i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#c9a227;margin-right:6px}
#status.ok i{background:#2e9e5b}
aside{padding:14px 16px;overflow:auto;border-right:1px solid var(--line)}
label{display:block;font-size:.8rem;color:var(--mut);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.06em}
select{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit}
#map{position:relative;width:100%;aspect-ratio:1/1;z-index:0;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:14px;overflow:hidden}
#map svg{position:absolute;inset:0;width:100%;height:100%}
.dot{position:absolute;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:var(--acc);border:3px solid #fff;box-shadow:0 0 0 2px var(--acc);cursor:pointer;transition:transform .15s}
.dot:hover,.dot.on{transform:translate(-50%,-50%) scale(1.5);z-index:2}
.dot .tip{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);white-space:nowrap;background:var(--fg);color:var(--bg);padding:3px 8px;border-radius:6px;font-size:.75rem;display:none}
.dot:hover .tip,.dot.on .tip{display:block}
ul{list-style:none;margin:14px 0 0;padding:0}
li{padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--card);cursor:pointer}
li:hover,li.on{border-color:var(--acc)}
li b{display:block;color:var(--acc)} li span{color:var(--mut);font-size:.85rem}
main{position:relative;background:#000}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#hover{position:absolute;left:18px;bottom:18px;max-width:420px;background:rgba(15,18,23,.82);color:#fff;padding:14px 16px;border-radius:12px;display:none;backdrop-filter:blur(6px)}
#hover b{font-size:1.1rem} #hover p{margin:.3em 0 0;color:#cdd6d9;font-size:.9rem}
#cfg{font-size:.8rem;color:var(--mut);margin-top:14px}
#cfg input{width:100%;padding:7px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;margin-top:4px}
@media(max-width:800px){body{grid-template-columns:1fr;grid-template-rows:auto auto 60vh}aside{border-right:0}main{grid-row:3}header{grid-column:1}}
</style></head><body>
<header><a href="./">← Etteln twin</a><h1>Live twin · walk through the village</h1><div id="status"><i></i><span>connecting…</span></div></header>
<aside>
  <label for="sel">Jump to a place</label>
  <select id="sel"></select>
  <div id="map" aria-label="Village map: aerial photo with building outlines"></div>
  <ul id="list"></ul>
  <div id="cfg">Stream address (your laptop for now)<input id="ps" value=""></div>
</aside>
<main><iframe id="fr" allow="autoplay; fullscreen; microphone" title="Live 3D twin"></iframe>
  <div id="hover"><b></b><p></p></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
// Checkpoints = the six fixed Etteln cameras of the Unreal level (positions in the sketch are indicative).
const POI=[
 {id:"ref3",cam:"ref3",name:"Overview from above",mx:-230.4,my:-34.9,note:"The village from 90 m up, looking down at 42 degrees."},
 {id:"ref1",cam:"ref1",name:"Church (west side)",mx:-200.4,my:-34.9,note:"Eye level west of the church, looking east."},
 {id:"ref2",cam:"ref2",name:"The stream",mx:-104.1,my:-10.4,note:"Eye level at the stream that runs through the village."},
 {id:"ref4",cam:"ref4",name:"Main road",mx:-113.6,my:61.4,note:"A street near the church, seen from 1.7 m."},
 {id:"ref5",cam:"ref5",name:"Fields",mx:-481.6,my:-249.7,note:"The edge of an arable field, looking back at the village."},
 {id:"ref6",cam:"ref6",name:"Far vista",mx:637.5,my:459.5,note:"900 m from the church, 76 m up: the whole village in its landscape."}
];
// Camera positions: Unreal metres (X east, Y south) around the church (-122.7, 15.0), converted to lat/lon; accurate to a few tens of metres.
const CH={lat:51.6311,lon:8.7610,x:-122.7,y:15.0};
POI.forEach(p=>{p.lat=CH.lat-(p.my-CH.y)/111320;p.lon=CH.lon+(p.mx-CH.x)/69100});
const $=s=>document.querySelector(s),fr=$('#fr'),map=$('#map'),sel=$('#sel'),list=$('#list'),hov=$('#hover'),stat=$('#status');
const q=new URLSearchParams(location.search);
const ps=q.get('ps')||localStorage.getItem('r2t_ps')||'http://localhost';
$('#ps').value=ps;
function load(u){try{localStorage.setItem('r2t_ps',u)}catch(e){}stat.className='';stat.lastChild.textContent='connecting to '+u;fr.src=u+(u.includes('?')?'&':'/?')+'HoveringMouse=true'}  // free mouse: right-drag looks, WASD flies (as in the Elen twin)
$('#ps').addEventListener('change',e=>load(e.target.value.trim()));
fr.addEventListener('load',()=>{stat.className='ok';stat.lastChild.textContent='stream page loaded'});

function show(p){hov.style.display='block';hov.querySelector('b').textContent=p.name;hov.querySelector('p').textContent=p.note;mark(p.id,true)}
function hide(){hov.style.display='none';mark(null,false)}
function mark(id,on){document.querySelectorAll('[data-id]').forEach(e=>e.classList.toggle('on',on&&e.dataset.id===id))}
const GOTO='http://localhost:8092/goto';  // tiny local server on the GPU laptop; the game flies the camera (same pattern as the Elen twin)
function go(p){sel.value=p.id;show(p);try{sel.blur();fr.focus()}catch(e){}lm.panTo([p.lat,p.lon]);
  fetch(GOTO,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({cam:p.cam})}).then(r=>{stat.lastChild.textContent=r.ok?'flying to '+p.name:'jump failed'}).catch(()=>{stat.lastChild.textContent='jump server not running on this computer'});
}
const lm=L.map('map',{zoomControl:true,attributionControl:true}).setView([CH.lat,CH.lon],16);
L.tileLayer.wms('https://www.wms.nrw.de/geobasis/wms_nw_dop',{layers:'nw_dop_rgb',format:'image/jpeg',attribution:'Geobasis NRW'}).addTo(lm);
L.tileLayer.wms('https://www.wms.nrw.de/geobasis/wms_nw_alkis',{layers:'adv_alkis_gebaeude',format:'image/png',transparent:true,attribution:'Geobasis NRW (ALKIS)'}).addTo(lm);
const mk={};
POI.forEach(p=>{
  sel.insertAdjacentHTML('beforeend',`<option value="${p.id}">${p.name}</option>`);
  const m=L.marker([p.lat,p.lon],{icon:L.divIcon({className:'',html:`<div class="dot" data-id="${p.id}" style="position:relative;left:0;top:0"><span class="tip">${p.name}</span></div>`,iconSize:[18,18]})}).addTo(lm);
  m.on('mouseover',()=>show(p));m.on('mouseout',hide);m.on('click',()=>go(p));mk[p.id]=m;
  const li=document.createElement('li');li.dataset.id=p.id;li.innerHTML=`<b>${p.name}</b><span>${p.note}</span>`;
  li.onmouseenter=()=>{show(p);lm.panTo([p.lat,p.lon])};li.onmouseleave=hide;li.onclick=()=>go(p);list.appendChild(li);
});
lm.fitBounds(L.latLngBounds(POI.map(p=>[p.lat,p.lon])).pad(0.25));
sel.onchange=()=>go(POI.find(p=>p.id===sel.value));
load(ps);
</script></body></html>
