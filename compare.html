<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Then and now</title>
<style>
:root{--bg:#f6f5f1;--fg:#1d2428;--mut:#5d6a70;--acc:#0b6e69}
@media (prefers-color-scheme:dark){:root{--bg:#14191b;--fg:#e8ecec;--mut:#9aa8ad;--acc:#4fc3bb}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,Segoe UI,sans-serif}
main{max-width:980px;margin:0 auto;padding:24px 16px}
.wrap{position:relative;overflow:hidden;border-radius:12px;aspect-ratio:16/10;background:#000;user-select:none}
.wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#top{clip-path:inset(0 50% 0 0)}
#bar{position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff;pointer-events:none}
input{width:100%;margin-top:12px;accent-color:var(--acc)}
.lab{display:flex;justify-content:space-between;color:var(--mut);margin-top:6px}
#msg{display:none;color:var(--mut)}
a{color:var(--acc)}
</style>
</head>
<body>
<main>
<p><a href="index.html">&larr; Back</a></p>
<h1>Then and now</h1>
<p id="msg">Coming soon: two surveys of the same view, side by side.</p>
<div class="wrap" id="w">
  <img id="bottom" src="after.jpg" alt="Now" onerror="document.getElementById('msg').style.display='block';document.getElementById('w').style.display='none'">
  <img id="top" src="before.jpg" alt="Before">
  <div id="bar"></div>
</div>
<input id="s" type="range" min="0" max="100" value="50" aria-label="Slide between before and after">
<div class="lab"><span>Before</span><span>Now</span></div>
<script>
const s=document.getElementById("s"),t=document.getElementById("top"),b=document.getElementById("bar");
s.oninput=()=>{t.style.clipPath="inset(0 "+(100-s.value)+"% 0 0)";b.style.left=s.value+"%"};
</script>
</main>
</body>
</html>
